name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Checkstyle runs in the validate phase and fails the build on a violation,
      # the tests run in the test phase, and the shaded jar comes out of package
      - name: Build
        run: mvn -B -Dbuild.number="#${{ github.run_number }}" clean package

      - name: Upload the plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AreaShop
          path: AreaShop/target/AreaShop.jar
          if-no-files-found: error

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: AreaShop/target/surefire-reports/
          if-no-files-found: ignore
