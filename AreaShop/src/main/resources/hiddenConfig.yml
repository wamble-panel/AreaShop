# ╔════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╗
# ║ hiddenConfig.yml file of the AreaShop plugin created by NLThijs48.                                                         ║
# ║ Options in this file are available in config.yml, but are not shown by default there.                                      ║
# ║ The options in these file are either very advanced, or not useful for the majority of users.                               ║
# ╚════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════╝
# ┌────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ TIMERS: Settings to define how often scheduled tasks run.                                                                  │
# └────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘
# Setting the 'delay' setting to 0 or lower will prevent the taks from runnning.
# The 'delay' settings are specified using a number followed by one of the identifiers as defined in config.yml.
# The 'regionsPerTick' settings are to configure how fast something goes, lower value is less lag, but slower updates.
# There are 20 ticks in 1 second, so if you set 'regionPerTick' to 5, then 5*20=100 regions per second will be updated.

# Timings for saving files that need saving.
saving:
  delay: '11 minutes'
  regionsPerTick: 1
# Timings for rent expiration checking.
expiration:
  delay: '14 seconds'
  regionsPerTick: 5
# Timings for expiration warning to online players.
expireWarning:
  delay: '11 seconds'
  regionsPerTick: 5
# Timings for updating signs and region flags ('/as reload' or after '/as groupadd' or '/as groupdel').
update:
  regionsPerTick: 10
# Time between checking if any regions need to be unrented because the player was not online for the specified time period.
inactive:
  delay: '17 minutes'
  regionsPerTick: 5
# Timings for the periodic updating of signs (for timeleft tags etc).
signs:
  delay: '1 minute'
  regionsPerTick: 3
# Number of regions per tick to check when a player joins to see if his name changed for regions he owned (updates the regions when changed).
nameupdate:
  regionsPerTick: 10
# Timings for adding regions to AreaShop ('/as stack').
adding:
  regionsPerTick: 2


# ┌────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ OTHER: All other settings.                                                                                                 │
# └────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘
# ┌────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ SUBLET: Letting the player holding a region rent the whole of it out to another player.                                    │
# └────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘
sublet:
  # Turn subletting on or off for the whole server.
  enabled: true
  # How often to check for rentals that have run out.
  delay: '2 minutes'
  # How many regions to check each tick while doing so.
  regionsPerTick: 10


# ┌────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ VILLAGERMARKET: Integration with the VillagerMarket plugin, used when it is installed.                                     │
# └────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘
villagerMarket:
  # What to do with the shop villagers standing in a region when it goes back on the market,
  # which happens when a rent runs out, a region is unrented or sold back, or a region is deleted.
  #   abandon: hand the shops back the way VillagerMarket does when a rent runs out. The owner gets
  #            their deposit and collected money back and their stock goes to '/vm expiredstorage',
  #            and the villager stays where it is for whoever rents the region next.
  #   remove:  hand the shops back first, so nothing is lost, and then take the villagers away as
  #            well, leaving the region empty.
  #   nothing: leave the shops alone.
  onRelease: abandon
  # Whether shops owned by someone other than the player losing the region are cleared too.
  # Leave this on for a marketplace, where the renter sublets stalls to other players.
  # Shops without an owner and admin shops are never touched.
  clearShopsOfOtherPlayers: true
  # Letting the owner of a region make the stalls in it bigger from '/as panel'.
  upgrades:
    enabled: true
    # The part customers buy from.
    shopfront:
      # Largest size a stall can be upgraded to, in slots. A row is 9 slots and 54 is a double chest.
      maxSlots: 54
      # What each extra row costs.
      pricePerRow: 2500
    # The part the owner of the stall stocks.
    storage:
      maxSlots: 54
      pricePerRow: 2500


# ┌────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ PANEL: The settings players can change for their own region from '/as panel'.                                              │
# └────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘
# Each entry becomes one item in the settings menu, and clicking it moves to the next option.
# The flag values use the same notation as the 'flagProfiles' section: a value, optionally followed
# by 'g:<group>' to set the group of the flag, and an empty value clears the flag again.
# Only flags listed here can ever be changed by a player, so leave out anything you do not want them to touch.
# Add 'permission: some.permission' to an entry to limit who may change it.
# These are applied after the flag profile of the region, so they are not lost when the region updates.
panelFlags:
  # Who may walk into the region.
  entry:
    item: OAK_DOOR
    name: '&e&lWho can enter'
    description: '&7Choose who may walk into your shop.'
    options:
      everyone:
        name: '&aEveryone'
        flags:
          entry: ''
      friends:
        name: '&eOnly you and the players you gave access'
        flags:
          entry: 'deny g:nonmembers'
  # Whether players can fight inside the region.
  pvp:
    item: IRON_SWORD
    name: '&e&lFighting'
    description: '&7Allow or block fighting in your shop.'
    options:
      off:
        name: '&aNo fighting'
        flags:
          pvp: 'deny'
      on:
        name: '&cFighting allowed'
        flags:
          pvp: 'allow'
  # Whether monsters can spawn inside the region.
  mobs:
    item: ZOMBIE_HEAD
    name: '&e&lMonsters'
    description: '&7Keep monsters out of your shop.'
    options:
      off:
        name: '&aNo monsters'
        flags:
          mob-spawning: 'deny'
      on:
        name: '&cMonsters can spawn'
        flags:
          mob-spawning: 'allow'
  # Whether visitors may open your chests.
  chests:
    item: CHEST
    name: '&e&lChest access'
    description: '&7Choose who may open the containers in your shop.'
    options:
      friends:
        name: '&aOnly you and the players you gave access'
        flags:
          chest-access: 'deny g:nonmembers'
      everyone:
        name: '&cEveryone'
        flags:
          chest-access: 'allow'

# How many visible characters the name set with '/as setname' may have (color codes do not count).
shopNameMaxLength: 64
# Service id of AreaShop on https://bstats.org, only change this when you run a fork with its own statistics page.
bstatsId: 3204
# Allow or disallow extending a rental region when the player is above his limits enforced by the 'limitGroups' section below.
# false will ensure a player will eventually lose his region when he has no access anymore.
allowRegionExtendsWhenAboveLimits: false
# Flag profiles that can be used by the 'general.flagProfile' setting in default.yml
flagProfiles:
# Event command profiles that can be used by the 'general.eventCommandProfile' setting in default.yml
eventCommandProfiles:
# Sign profiles that can be used by the 'general.signProfile' setting in default.yml
signProfiles:
# Schematic profiles that can be used by the 'general.schematicProfile' setting in default.yml
schematicProfiles:
